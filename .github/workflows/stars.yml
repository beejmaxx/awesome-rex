name: Stars

# Star counts are live shields.io badges, so this only adds badges to entries that
# arrived without one (for example from a merged pull request).
on:
  push:
    branches: [main]
    paths: [README.md]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stars
  cancel-in-progress: false

jobs:
  badges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/update-stars.py
      - run: npx --yes awesome-lint
      - name: Commit added badges
        run: |
          if git diff --quiet -- README.md; then
            echo "Every repository entry has a star badge."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add star badges to new entries" -- README.md
          git push
