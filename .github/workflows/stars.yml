name: Stars

on:
  schedule:
    - cron: "0 0 * * 0" # Sundays, clear of the Monday/Wednesday/Friday showcase updates
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stars
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 scripts/update-stars.py
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npx --yes awesome-lint
      - name: Commit changed counts
        run: |
          if git diff --quiet -- README.md; then
            echo "Star counts are current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh star counts" -- README.md
          git push
